<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Personas Quiz</title>

 <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    background-image: url("https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/refs/heads/main/sfondo.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #6f4e37;
  }

  .app {
    width: 100%;
    max-width: 820px;
    padding: 32px;

    background: #ede5da;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(59, 36, 23, 0.15);
  }

  /* Titolo iniziale */

  .title {
    margin-bottom: 10px;

    font-family: "Poppins", Arial, sans-serif;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
  }

  .subtitle {
    margin-bottom: 28px;

    font-family: "Poppins", Arial, sans-serif;
    line-height: 1.5;
    text-align: center;
    color: #6f4e37;
  }

  /* Email e privacy */

  .email-box {
    display: grid;
    gap: 14px;
  }

  .email-input {
    width: 100%;
    padding: 16px 18px;

    border: 1px solid #e0cbbb;
    border-radius: 16px;
    background: #ffffff;

    font-size: 1rem;
    color: #3b2417;
  }

  .email-input:focus {
    outline: 2px solid #b57b55;
    outline-offset: 2px;
  }

  .privacy-box {
    display: grid;
    gap: 12px;

    font-size: 0.9rem;
    line-height: 1.4;
    color: #6a4a3a;
  }

  .privacy-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .privacy-label input {
    flex-shrink: 0;
    margin-top: 3px;
  }

  .privacy-small {
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .privacy-small a {
    color: #6f4e37;
    font-weight: 700;
  }

  /* Pulsanti */

  .start-btn,
  .answer-btn,
  .restart-btn {
    padding: 16px 18px;

    border: none;
    border-radius: 16px;

    font-size: 1rem;
    cursor: pointer;
    transition:
      background-color 0.25s ease,
      color 0.25s ease,
      transform 0.25s ease;
  }

  .start-btn,
  .restart-btn {
    width: 100%;
    background: #6f4e37;
    color: #ffffff;
  }

  .start-btn:hover,
  .restart-btn:hover {
    background: #5b3f2c;
    transform: translateY(-2px);
  }

  /* Barra di avanzamento */

  .progress-wrap {
    margin-bottom: 24px;
  }

  .progress-text {
    margin-bottom: 8px;

    font-size: 0.95rem;
    color: #6a4a3a;
  }

  .progress-bar {
    width: 100%;
    height: 10px;

    overflow: hidden;
    background: #ead9cc;
    border-radius: 999px;
  }

  .progress {
    height: 100%;

    background: linear-gradient(90deg, #6f4e37, #b57b55);
    transition: width 0.3s ease;
  }

  /* Domande */

  .question {
    margin-bottom: 22px;

    font-size: 1.4rem;
    line-height: 1.4;
  }

  .answers {
    display: grid;
    gap: 14px;
  }

  .answer-btn {
    width: 100%;

    background: #6f4e37;
    color: #ffffff;
    text-align: left;
  }

  .answer-btn:hover {
    background: #e8d2c1;
    color: #5c4033;
    transform: translateY(-2px);
  }

  /* Risultato */

  .result-badge {
    display: inline-block;
    margin-bottom: 16px;
    padding: 8px 14px;

    border-radius: 999px;
    background: #f0dfd2;

    color: #6f4e37;
    font-weight: 700;
  }

  .result-title {
    margin-bottom: 16px;
    font-size: 2rem;
  }

  .result-images {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;

    margin-bottom: 24px;
  }

  .result-image {
    display: block;
    width: 100%;
    max-width: 200px;
    height: auto;
  }

  .result-description {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #5c4033;
    text-align: left;
    white-space: normal;
  }

  /* Ogni blocco: Mood, Combo, Descrizione, Energia, Flags */

  .result-section {
    margin-bottom: 24px;
  }

  .result-section:last-child {
    margin-bottom: 0;
  }

  .result-label {
    margin-bottom: 8px;
    font-weight: 700;
  }

  .result-description p {
    margin: 0;
  }

  .result-description ul {
    margin: 0;
    padding-left: 24px;
  }

  .result-description li {
    margin-bottom: 5px;
    line-height: 1.4;
  }

  .result-description li:last-child {
    margin-bottom: 0;
  }

  /* Spazio tra descrizione e pulsante */

  .restart-btn {
    margin-top: 32px;
  }

  /* Messaggi */

  .error-message {
    font-size: 0.9rem;
    color: #9b2c2c;
    text-align: center;
  }

  .footer-note {
    margin-top: 20px;

    font-size: 0.9rem;
    color: #7b6253;
    text-align: center;
  }

  /* Mobile */

  @media (max-width: 640px) {
    body {
      padding: 14px;
      align-items: flex-start;
    }

    .app {
      padding: 24px 18px;
      border-radius: 18px;
    }

    .title {
      font-size: 1.7rem;
    }

    .question {
      font-size: 1.2rem;
    }

    .result-title {
      font-size: 1.6rem;
    }

    .result-description {
      font-size: 0.98rem;
    }

    .result-section {
      margin-bottom: 20px;
    }

    .result-images {
      gap: 12px;
    }

    .result-image {
      max-width: 160px;
    }

    .restart-btn {
      margin-top: 26px;
    }
  }
</style>
</head>

<body>
  <div class="app">
<h1 class="title">Coffee that matches your vibe</h1>

<p class="subtitle">
  Inserisci la tua email, rispondi alle 5 domande e scopri la tua Coffee Persona
</p>

<div id="email-step">
      <div class="email-box">
        <input
          type="email"
          id="user-email"
          class="email-input"
          placeholder="Inserisci la tua email"
        />

       <div class="privacy-box">
  <p>Ai sensi degli artt. 6-8 del Reg. (UE) 2016/679</p>

  <label class="privacy-label">
    <input type="checkbox" id="marketing-check" />
    <span>
      Autorizzo il trattamento dei dati personali per promozione e vendita di prodotti e servizi,
      invio di informazioni commerciali, marketing e rilevazione del grado di soddisfazione.
    </span>
  </label>

  <label class="privacy-label">
    <input type="checkbox" id="profiling-check" />
    <span>
      Autorizzo la profilazione delle attività e degli interessi specifici relativi alle comunicazioni inviate
      al fine di proporre offerte commerciali mirate e report di analisi.
    </span>
  </label>

  <p class="privacy-small">
    Per leggere l’intera informativa sulle attività di marketing
    <a href="https://vergnano1882.sharepoint.com/:w:/r/Shared%20Documents/informativa%20attivit%C3%A0%20di%20marketing.docx?d=w419fd2e5fd8e4fb292bc37df55b0ca2f&csf=1&web=1&e=aUnSCa" target="_blank">
      clicca qui
    </a>.
  </p>
</div>

        <button class="start-btn" onclick="startQuiz()">Inizia il quiz</button>
        <p id="email-error" class="error-message"></p>
      </div>
    </div>

    <div id="quiz-container" style="display: none;"></div>
  </div>

  <script>
  const GOOGLE_ENDPOINT = "https://script.google.com/macros/s/AKfycbz593S16u5dnmg-LD37KmelT_MKuXzhq8tmkAOXKRJH_GjuSBrXgQ3Uwv7hLle5ERqT/exec";

  const questions = [
    {
      question: "Come inizia la tua giornata?",
      answers: [
        { text: "La sveglia suona e sono già in piedi", type: "ER" },
        { text: "Dopo uno o due 'snooze'", type: "CS" },
        { text: "Le mie attività sono già tutte pianificate", type: "MP" },
        { text: "Senza fretta, con una bella colazione", type: "DZ" },
        { text: "In realtà non sono ancora andato a dormire dalla sera prima ", type: "EM" }
      ]
    },
    {
      question: "La playlist del tuo risveglio",
      answers: [
        { text: "Rock", type: "ER" },
        { text: "Reggaeton & Latin Pop", type: "CS" },
        { text: "Pop", type: "MP" },
        { text: "Indie", type: "DZ" },
        { text: "Elettronica", type: "EM" }
      ]
    },
    {
      question: "Cosa cerchi nel tuo caffè?",
      answers: [
        { text: "La carica giusta per partire", type: "ER" },
        { text: "Un momento da condividere", type: "CS" },
        { text: "Un gusto intenso che si faccia ricordare", type: "MP" },
        { text: "Una pausa tutta per me", type: "DZ" },
        { text: "Un twist che lo renda interessante", type: "EM" }
      ]
    },
    {
      question: "Qual'è il tuo ruolo in un morning club?",
      answers: [
        { text: "Sempre in pista, non mi fermo", type: "ER" },
        { text: "Parlo con tutti: fare networking è il mio sport preferito", type: "CS" },
        { text: "Tra una chiacchera e l'altra, incastro mille appuntamenti ", type: "MP" },
        { text: "Mi godo il momento: il relax viene prima di tutto ", type: "DZ" },
        { text: "Arrivo per ultimo… ma mi faccio notare ", type: "EM" }
      ]
    },
    {
      question: "Come descriveresti il tuo weekend ideale?",
      answers: [
        { text: "un Viaggio last minute in una capitale Europea", type: "ER" },
        { text: "Inizio con un aperitivo… e vedo come va ", type: "CS" },
        { text: "Agenda piena: eventi, programmi e zero tempi morti", type: "MP" },
        { text: "Relax e ritmi lenti", type: "DZ" },
        { text: "Nessun programma: le serate migliori sono quelle improvvisate ", type: "EM" }
      ]
    }
  ];

  const resultsMap = {
    ER: {
      image: [
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/espresso.png",
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/Espresso%20Raver.png"
      ],
description: `
  <div class="result-section">
    <div class="result-label">Il Mood</div>
    <p>"Il risveglio è il mio mainstage".</p>
  </div>

  <div class="result-section">
    <div class="result-label">La tua combo</div>
    <p>Espresso, Succo Ace & Cornetto vuoto</p>
  </div>

  <div class="result-section">
    <div class="result-label">Descrizione:</div>
    <p>Trasformi le prime ore del giorno in un’esplosione di energia...</p>
  </div>

  <div class="result-section">
    <div class="result-label">Energia:</div>
    <p>100% pura & senza compromessi.</p>
  </div>

  <div class="result-section">
    <div class="result-label">Green Flags:</div>
    <ul>
      <li>Sei l’amico che propone sempre qualcosa di nuovo da fare</li>
      <li>Sempre dritto al punto senza giri di parole</li>
      <li>Super produttivo</li>
    </ul>
  </div>

  <div class="result-section">
    <div class="result-label">Red Flags:</div>
    <ul>
      <li>Impaziente cronico</li>
      <li>Rispondi “Ok” quando sei arrabbiato</li>
      <li>Giudichi chi dorme più di 7 ore</li>
    </ul>
  </div>
`

    },
    CS: {
      image: [
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/cappuccino.png",
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/Cappuccino%20Socializer.png"
      ],
      description: `Il Mood: "Il ritmo nasce dalla compagnia".
      
Descrizione: La tua energia nasce dall’interazione con gli altri: conversazioni, condivisioni di esperienze o il semplice stare in gruppo ti carica. Ogni sorso di caffè è un’occasione per scambiare idee, per te non c’è modo migliore di iniziare una bella giornata con una colazione tra amici. Non hai fretta di tuffarti nel caos quotidiano, preferisci goderti la schiuma della conversazione mentre il beat della giornata sale lentamente.

Energia: Parte al 30% per arrivare al 100% in serata
Green Flags:
-Empatico e sensibile
-Sempre aggiornato sui gossip
-Senza di te le serate non sono abbastanza spicy da essere raccontate
Red Flags:
-Logorroico
-Eterno indeciso
-Influenzabile dai giudizi degli altri
La tua combo: Cappuccino, Succo Pesca & Cornetto alla crema`
    },
    MP: {
      image: [
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/macchiato.png",
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/Macchiato%20Performer.png"
      ],
      description: `Il Mood: "Sempre il Numero 1".
      
Descrizione: Ti piace dominare la scena, dirigere il ritmo e non lasciare nulla al caso. Non segui il flusso: lo detti. Quando entri in una stanza, si percepisce grazie alla tua leadership naturale. Sai essere dolce senza perdere la tua intensità, ma attenzione a pensare che siano tutti come te.

Energia: 80%
Green Flags:
-Equilibrato ma con carattere
-Responsabile e autonomo
-Feedback-friendly
Red Flags:
-Pretendi troppo
-Permaloso
-Tendi ad essere sempre al centro dell’attenzione

La tua combo: Caffè Macchiato, Succo Albicocca  & Cornetto al Cioccolato`
    },
    DZ: {
      image: [
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/deca.png",
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/Deca%20Zen.png"
      ],
      description: `Il Mood: "Equilibrio ad ogni sorso".
      
Descrizione: Il mondo scorre intorno a lui, ma lui resta centrato. Il Deca Zen non rincorre la giornata, la accompagna. Il caffè è pure piacere, non una carica: equilibrio e armonia definiscono il suo ritmo. Non ci sono problemi che non puoi gestire o situazioni che non puoi controllare, tutto per te è semplice e inizia con un bel caffè Deca.

Energia: 50%
Green Flags:
-Non c’è nessuno meno stressato di te
-Hai una soluzione ad ogni problema, anche perché per te non esistono veri problemi
-Ottimista
Red Flags:
-Ritardatario cronico
-Superficiale
-Disorganizzato
La tua combo: Caffè Decaffeinato, Succo Mirtillo & Cornetto Cioccolato`
    },
    EM: {
      image: [
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/martini.png",
        "https://raw.githubusercontent.com/CaffeVergnano/SoftClubbing-/main/Espresso%20Martini%20Nightrunner.png"
      ],
      description: `Il Mood: "La notte non finisce, evolve".
      
Descrizione: Per chi vive tra la notte e il mattino. L’Espresso Martini è il twist della giornata: non segue il flow, lo trasforma. Entri nel “Morning Club” con l’attitudine di chi ha già vissuto tutto — e ha ancora voglia di un ultimo giro. Niente può essere banale, ti piacciono le cose complesse e sfaccettate altrimenti per te non c’è sfida. Sei eclettico, ma spesso è difficile capirti.

Energia: 70%
Green Flags:
-Sognatore
-Raffinato e sempre all’ultima moda
-Originale
Red Flags:
-Ma quanto te la tiri
-Più complicato di un cubo di Rubik
-Misterioso fino alla fine

La tua combo: Espresso Martini & Toast`
    }
  };
    
   let userEmail = "";
  let currentQuestion = 0;
  let userAnswers = [];

  let scores = {
    ER: 0,
    CS: 0,
    MP: 0,
    DZ: 0,
    EM: 0
  };

  const quizContainer = document.getElementById("quiz-container");

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function startQuiz() {

    const email = document.getElementById("user-email").value.trim();

    const marketingChecked =
      document.getElementById("marketing-check").checked;

    const profilingChecked =
      document.getElementById("profiling-check").checked;

    const error = document.getElementById("email-error");

    if (!isValidEmail(email)) {
      error.textContent = "Inserisci una email valida.";
      return;
    }

    if (!marketingChecked || !profilingChecked) {
      error.textContent =
        "Devi accettare entrambi i consensi per continuare.";
      return;
    }

    userEmail = email;
    error.textContent = "";

    document.getElementById("email-step").style.display = "none";

    quizContainer.style.display = "block";

    renderQuestion();
  }

  function renderQuestion() {

    const q = questions[currentQuestion];

    const progressPercent =
      (currentQuestion / questions.length) * 100;

    quizContainer.innerHTML = `
      <div class="progress-wrap">

        <div class="progress-text">
          Domanda ${currentQuestion + 1} di ${questions.length}
        </div>

        <div class="progress-bar">
          <div class="progress"
            style="width:${progressPercent}%;">
          </div>
        </div>

      </div>

      <h2 class="question">${q.question}</h2>

      <div class="answers" id="answers-container"></div>
    `;

    const answersContainer =
      document.getElementById("answers-container");

    q.answers.forEach(answer => {

      const button = document.createElement("button");

      button.className = "answer-btn";

      button.textContent = answer.text;

      button.addEventListener("click", () =>
        selectAnswer(answer)
      );

      answersContainer.appendChild(button);

    });
  }

  function selectAnswer(answer) {

    scores[answer.type]++;

    userAnswers.push({
      question: questions[currentQuestion].question,
      answer: answer.text,
      personaCode: answer.type
    });

    currentQuestion++;

    if (currentQuestion < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function saveLead(finalType, resultName) {

    fetch(GOOGLE_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        email: userEmail,
        result: resultName,
        resultCode: finalType,
        marketingConsent: true,
        profilingConsent: true,
        answers: userAnswers
      })
    });
  }

  function showResult() {
  const finalType = Object.keys(scores).reduce((a, b) =>
    scores[a] >= scores[b] ? a : b
  );

  const result = resultsMap[finalType];

  const resultName = result.name || finalType;
  const resultImages = result.images || result.image;

  saveLead(finalType, resultName);

  quizContainer.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-text">Quiz completato</div>
      <div class="progress-bar">
        <div class="progress" style="width:100%;"></div>
      </div>
    </div>

    <div class="result">
      <div class="result-badge">Risultato finale</div>

      <div class="result-images">
        <img src="${resultImages[0]}" class="result-image" alt="${resultName}" />
        <img src="${resultImages[1]}" class="result-image" alt="${resultName}" />
      </div>

      <div class="result-description">${result.description}</div>

      <button class="restart-btn" onclick="restartQuiz()">Ricomincia il quiz</button>
    </div>
  `;
}
  function restartQuiz() {

    currentQuestion = 0;

    userAnswers = [];

    scores = {
      ER: 0,
      CS: 0,
      MP: 0,
      DZ: 0,
      EM: 0
    };

    document.getElementById("email-step").style.display = "block";

    quizContainer.style.display = "none";

    quizContainer.innerHTML = "";
  }
</script>
</body>
</html>
